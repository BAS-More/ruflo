name: Python Examples

on:
  pull_request:
    paths:
      - 'v2/examples/flask-api-sparc/**'
      - 'v2/examples/litellm/docker/requirements.txt'
      - '.github/workflows/flask-example.yml'
  push:
    branches: [main]
    paths:
      - 'v2/examples/flask-api-sparc/**'
      - 'v2/examples/litellm/docker/requirements.txt'
      - '.github/workflows/flask-example.yml'

permissions:
  contents: read

jobs:
  flask-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/examples/flask-api-sparc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2/examples/flask-api-sparc/requirements.txt
      - name: Install example dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check formatting
        run: python -m black --check src tests
      - name: Test against isolated in-memory SQLite
        run: python -m pytest --cov-fail-under=80

  litellm-dependency-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve proxy dependencies without running providers
        run: >-
          python -m pip install --dry-run --ignore-installed --only-binary=:all:
          -r v2/examples/litellm/docker/requirements.txt
